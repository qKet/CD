# prod도 release와 동일하게 IRSA로 S3 접근 (고정 키 방식인 aws-secrets는 안 씀).
# 단, IRSA는 네임스페이스+ServiceAccount 이름 조합으로 신뢰관계가 걸려있어서
# Terraform 쪽에 qket-prod 네임스페이스용 IRSA Role/ServiceAccount가 별도로 있어야 함
# (modules/storage/backend-irsa.tf를 prod 네임스페이스로도 인스턴스화 필요).

namespace: qket-prod

backend:
  replicas: 2
  serviceAccountName: qket-backend
  configMaps:
    - app-config
    - storage-config
    # notification-config 뺀 이유는 helm/values.yaml 주석 참고 (2026-08-18)
  secrets:
    - db-secrets
    - redis-secrets
    - external-api-secrets #Secret Manager 값 가져오기
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

frontend:
  replicas: 2
  resources:
    # CPU limit을 없앤 이유는 helm/values.yaml의 frontend.resources 주석 참고
    # (2026-08-18, CFS 스로틀링 → request 기반 fair-share로 전환).
    requests:
      cpu: "0.5"
      memory: "250Mi"
    limits:
      memory: "500Mi"

ingress:
  host: app.jun979.click
  # prod는 모든 사용자 IP inbound 허용

networkPolicy:
  allowedNamespaces:
    - qket-prod
    - monitoring
