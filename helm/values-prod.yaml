namespace: qket-prod

backend:
  replicas: 2
  serviceAccountName: "" # prod는 IRSA 서비스어카운트 안 씀
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  readinessProbe:
    enabled: true
    path: /api/actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 6
  configMaps:
    - app-config
  secrets:
    - db-secrets
    - redis-secrets
    - aws-secrets

frontend:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: "0.5"
      memory: "250Mi"
    limits:
      cpu: "1"
      memory: "500Mi"

ingress:
  host: app.jun979.click
  certificateArn: "arn:aws:acm:ap-northeast-2:727646470302:certificate/a9789e71-7453-43d9-b0db-ad2ac973f4c0"
  # prod는 모든 사용자 IP inbound 허용 (inboundCidr 안 씀)

networkPolicy:
  allowedNamespaces:
    - qket-prod
    - monitoring
