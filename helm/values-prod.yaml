# prod도 release와 동일하게 IRSA로 S3 접근. IRSA Role/ServiceAccount는 04_data/prod의
# module.storage가 만들어둠.

namespace: qket-prod

# ArgoCD Application(qket-cd)이 values-release.yaml을 먼저 깔고 이 파일로 덮어씀 — 여기서
# 안 채운 키는 release 값을 물려받는다. dbPoolSize/autoscaling처럼 RDS 용량에 맞춰 계산해야
# 하는 값은 release(db.t3.medium 기준)를 그대로 물려주면 안 돼서 prod(db.t3.small) 기준으로
# 새로 계산해 덮어씀.

backend:
  # CI가 main 브랜치 push마다 갱신 — prod만의 태그(레이어링으로 release 값을 덮어씀).
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:backend-2d5fbd9
  replicas: 4
  # prod RDS(db.t3.small)는 max_connections ≈ 170 — dbPoolSize 12 × maxReplicas 8 = 96(약 56%).
  # minReplicas는 4로(round 62 부하테스트에서 순간폭증 로그인이 파드 2개로는 못 버텨 84%까지
  # 떨어짐 — 상시 4개로 스케일업 전 구간 흡수력 확보).
  dbPoolSize: 12
  autoscaling:
    minReplicas: 4
    maxReplicas: 8
    targetCPUUtilization: 70

  serviceAccountName: qket-backend
  configMaps:
    - app-config
    - storage-config
    # notification-config 뺀 이유는 values-release.yaml 참고
  secrets:
    - db-secrets
    - redis-secrets
    - external-api-secrets #Secret Manager 값 가져오기
  # request를 250m→500m로 현실화: 콜드스타트/로그인폭주 시 실사용량이 700~900m까지 튀는데
  # request가 너무 작아 스케줄러가 노드 여유를 오판, 파드를 한 노드에 몰아넣었음(round 62
  # 부하테스트 실측). request를 실제 사용량에 맞춰 bin-packing 판단을 현실화해 분산을 강제.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "1Gi"

frontend:
  # CI가 main 브랜치 push마다 갱신 — backend와 같은 이유.
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:frontend-2c65d91
  replicas: 2
  # 프론트는 DB 커넥션과 무관하지만 backend replica 규모와 비율을 맞춰 절반 규모로 명시.
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70
  revisionHistoryLimit: 2
  resources:
    # CPU limit을 없앤 이유는 values-release.yaml의 frontend.resources 참고(CFS 스로틀링 회피).
    requests:
      cpu: "0.5"
      memory: "250Mi"
    limits:
      memory: "500Mi"

ingress:
  host: app.jun979.click
  # prod는 모든 사용자 IP inbound 허용

networkPolicy:
  allowedNamespaces:
    - qket-prod
    - monitoring
  # release와 동일 — 8081은 ALB 헬스체크 전용 포트(values-release.yaml 참고). prod 파일만
  # 보고도 알 수 있게 명시.
  ports:
    - 8080
    - 8081
