# CI가 이미지 push 후 이 파일의 backend.image / frontend.image 값을 갱신 (git commit)
# → ArgoCD가 감지해서 재배포. (예전엔 Deployment yaml의 image: 줄을 직접 고쳤지만,
#   chart로 바뀐 뒤로는 여기 값만 고치면 됨)

namespace: qket-release

backend:
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:backend-662a1d8
  # KEDA(backend-scaledobject.yaml)가 autoscaling.minReplicas~maxReplicas 사이에서 replicas를
  # 실시간으로 조절함 — 이 값은 그냥 "최초 배포 시 초기값"일 뿐, ArgoCD가 그 이후로 이 필드를
  # 계속 강제하진 않음(02_k8s-addon/argocd-apps.tf의 ignoreDifferences 참고).
  replicas: 4
  # dbPoolSize는 maxReplicas × dbPoolSize가 RDS max_connections(db.t3.micro 기준 ~85)를
  # 넘지 않게 잡아야 함 — 지금 8×10=80으로 여유 있게. 2026-08-13 부하테스트(8×40=320으로
  # 잡았다가 "커넥션 생성" 자체가 병목났던 사고) 이후로 이 계산을 항상 먼저 하기로 함.
  dbPoolSize: 10
  autoscaling:
    minReplicas: 4
    maxReplicas: 8
    targetCPUUtilization: 70
  serviceAccountName: qket-backend
  configMaps:
    - app-config
    - storage-config
  secrets:
    - db-secrets
    - redis-secrets
    - external-api-secrets #Secret Manager 값 가져오기
  resources:
    # 2026-08-13 부하테스트에서 250m/1로는 CPU 스로틀링이 심하게 걸려서(BCrypt 로그인 검증이
    # CPU를 많이 씀) 상향 — 지금 노드가 t3.xlarge라 여유 있음
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "1Gi"

frontend:
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:frontend-a765758
  replicas: 1
  revisionHistoryLimit: 2
  resources:
    requests:
      cpu: "0.25"
      memory: "128Mi"
    limits:
      cpu: "0.5"
      memory: "256Mi"

# 2026-08-10: 실제 Ingress 오브젝트는 이제 여기(Helm/ArgoCD)가 아니라 Infra(02_k8s-addon,
# kubernetes_ingress_v1.app_ingress)가 만듦 — destroy 시 "Ingress가 alb_controller보다 먼저
# 없어져야 한다"는 순서를 depends_on으로 강제하려고 같은 Terraform state로 옮김. host만
# 여기 남겨둔 이유는 backend-deployment.yaml의 APP_BASE_URL(소셜 로그인 리다이렉트)이 참조하기
# 때문 — Infra 쪽 locals.ingress_config와 같은 값을 나타내지만 용도가 달라서 하나로 합치진 않음.
ingress:
  host: dev.jun979.click # dev 쪽 Route53 추가 필요

networkPolicy:
  allowedNamespaces:
    - qket-release # 동일 namespace 안에서만 트래픽 허용
  port: 8080
