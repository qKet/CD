# KEDA ScaledObject — qket-frontend를 CPU 사용률 기준으로 자동 스케일. backend-scaledobject.yaml과
# 동일 패턴. CPU 스로틀링 자체는 values.yaml의 frontend.resources.limits.cpu 조정으로 해결한
# 별개 문제 — 이 리소스는 "부하가 늘면 replica를 늘린다"만 담당.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qket-frontend-scaledobject
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: qket-frontend
  minReplicaCount: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.frontend.autoscaling.maxReplicas }}
  # backend와 동일하게 5분간 관찰 후 그 사이 제일 높았던 시점 기준으로 줄임(급한 스케일다운 방지)
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.frontend.autoscaling.targetCPUUtilization }}"
