# KEDA ScaledObject — qket-backend를 CPU 사용률 기준으로 자동 스케일(내부적으로 HPA를 만들어서 씀).
# KEDA 컨트롤러 자체는 Infra(Terraform, modules/addons/keda)가 설치함 — 여긴 "무엇을 어떻게
# 스케일할지" 규칙만 정의.
#
# 나중에 대기열(Redis) 길이 기준으로도 스케일하고 싶어지면, triggers 배열에 이런 식으로 추가하면 됨
# (KEDA는 트리거 여러 개를 OR로 평가 — 아무 하나라도 스케일 필요하다고 하면 늘어남):
#   - type: redis
#     metadata:
#       address: <redis-host>:6379
#       listName: queue:waiting
#       listLength: "50"   # 대기 인원 50명 넘으면 스케일업
#
# 주의: minReplicaCount × backend.dbPoolSize, maxReplicaCount × backend.dbPoolSize 둘 다
# RDS max_connections(db.t3.micro 기준 ~85)를 넘으면 안 됨 — 2026-08-13 부하테스트 사고 참고.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qket-backend-scaledobject
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: qket-backend
  minReplicaCount: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.backend.autoscaling.maxReplicas }}
  # 스케일다운을 너무 성급하게 하지 않게(부하가 잠깐 줄었다고 바로 줄이면 다시 튈 때 또 느려짐) —
  # 5분간 관찰하고 그 사이 제일 높았던 시점 기준으로 줄임
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.backend.autoscaling.targetCPUUtilization }}"
