# KEDA ScaledObject — qket-backend를 CPU 사용률 기준으로 자동 스케일(내부적으로 HPA 생성).
# KEDA 컨트롤러 자체는 Infra(modules/addons/keda)가 설치, 여긴 스케일 규칙만 정의.
#
# 나중에 대기열(Redis) 길이 기준 트리거를 추가하려면 triggers 배열에 type: redis 항목을
# 추가하면 됨(KEDA는 트리거 여러 개를 OR로 평가).
#
# 주의: min/maxReplicaCount × backend.dbPoolSize가 RDS max_connections를 넘으면 안 됨.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qket-backend-scaledobject
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: qket-backend
  minReplicaCount: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.backend.autoscaling.maxReplicas }}
  # 스케일다운을 너무 성급하게 하지 않게(부하가 잠깐 줄었다고 바로 줄이면 다시 튈 때 또 느려짐) —
  # 5분간 관찰하고 그 사이 제일 높았던 시점 기준으로 줄임
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.backend.autoscaling.targetCPUUtilization }}"
