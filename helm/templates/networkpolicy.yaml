apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-same-namespace
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app: qket-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              name: {{ . }}
        {{- end }}
        # ALB(Gateway API, targetType: ip)가 Service를 안 거치고 backend 파드로 직접 붙는 경로 —
        # ALB ENI는 파드/네임스페이스 신원이 없어서 namespaceSelector로는 안 걸려서 CIDR로 허용.
        # 없으면 API 요청뿐 아니라 헬스체크(8081)까지 막혀서 전체 다운으로 이어짐.
        {{- range .Values.networkPolicy.allowedCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.ports }}
        - port: {{ . }}
        {{- end }}
