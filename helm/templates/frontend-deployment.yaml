apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-frontend
  namespace: {{ .Values.namespace }}
spec:
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit }}
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: qket-frontend
  template:
    metadata:
      labels:
        app: qket-frontend
    spec:
      # backend-deployment.yaml과 동일한 이유 — frontend는 CPU limit이 없어서 한 노드에
      # 몰리면 그 노드를 포화시켜 같은 노드의 backend 파드까지 굶길 수 있음.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # 오버프로비저닝 도입 이후 backend와 함께 DoNotSchedule로 재검증 중(backend-deployment.yaml 참고).
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: qket-frontend
      containers:
        - name: qket-frontend
          # CI가 이미지 push 후 values.yaml의 frontend.image를 갱신 (git commit) → ArgoCD가 감지해서 재배포
          image: {{ .Values.frontend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          env:
            # next.config.js의 rewrites()가 이 값 기준으로 /api/* 를 백엔드로 프록시함 —
            # path는 안 붙임(destination에서 이미 /api/:path*를 붙이므로 겹침).
            - name: CLUSTER_IP
              value: "http://qket-backend-service"
            # 컨테이너 기본 UTC라 백엔드가 내려주는 시간 문자열을 잘못 파싱하던 버그 있었음 —
            # backend-deployment.yaml과 동일하게 맞춤.
            - name: TZ
              value: "Asia/Seoul"
          # ALB 헬스체크와 별개 계층 — k8s 자체 재시작(liveness)/트래픽 제외(readiness) 판단용.
          # app/healthz/route.ts는 DB/backend 호출 없이 즉시 응답.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: qket-frontend-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: qket-frontend
