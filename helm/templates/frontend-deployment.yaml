apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-frontend
  namespace: {{ .Values.namespace }}
spec:
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit }}
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: qket-frontend
  template:
    metadata:
      labels:
        app: qket-frontend
    spec:
      containers:
        - name: qket-frontend
          # CI가 이미지 push 후 values.yaml의 frontend.image를 갱신 (git commit) → ArgoCD가 감지해서 재배포
          image: {{ .Values.frontend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          env:
            # frontend/next.config.js의 rewrites()가 이 값(없으면 http://localhost:8080로 폴백)을
            # 기준으로 /api/* 요청을 백엔드로 프록시함 — 반드시 CLUSTER_IP여야 함(BACKEND_URL 아님).
            # path는 안 붙임 — next.config.js가 destination 만들 때 이미 /api/:path*를 뒤에 붙이므로
            # 여기서 /api까지 넣으면 /api/api/... 로 겹침.
            - name: CLUSTER_IP
              value: "http://qket-backend-service"

---
apiVersion: v1
kind: Service
metadata:
  name: qket-frontend-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: qket-frontend
