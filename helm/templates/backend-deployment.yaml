apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: qket-backend
  template:
    metadata:
      labels:
        app: qket-backend
    spec:
      {{- if .Values.backend.serviceAccountName }}
      # S3 업로드용 IRSA — Terraform(module.storage)이 만든 서비스어카운트.
      # 이걸로 뜨면 S3Client가 고정 키 없이 자동으로 이 역할의 임시 자격증명을 씀.
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      {{- end }}
      # 신규 파드가 몰려 뜨면 JVM 콜드스타트 CPU 버스트가 한 노드에 겹쳐서 liveness/readiness
      # probe 타임아웃 → 재시작 반복이 재현됨. 노드별로 고르게 분산시켜 완화.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # DoNotSchedule은 한 번 로그인 대량 실패로 롤백된 적 있음(신규 노드를 기다리느라
          # 스케일업이 늦어짐) — 오버프로비저닝 도입 후 그 원인이 없어져서 재검증 중.
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: qket-backend
      containers:
        - name: qket-backend
          # CI가 이미지 push 후 values.yaml의 backend.image를 갱신 (git commit) → ArgoCD가 감지해서 재배포
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 8081 # actuator 헬스체크 전용(management.server.port) — ALB가 여기로 헬스체크
          envFrom:
            {{- range .Values.backend.configMaps }}   # configMap 선언 
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.backend.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            # 소셜 로그인 완료 후 리다이렉트할 프론트엔드 origin (OAuthController가 씀).
            - name: APP_BASE_URL
              value: "https://{{ .Values.ingress.host }}"
            # replicas × dbPoolSize가 RDS max_connections를 넘지 않게 관리.
            - name: TZ
              value: "Asia/Seoul"
            - name: DB_POOL_SIZE
              value: "{{ .Values.backend.dbPoolSize }}"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # ALB 헬스체크와 별개 계층 — k8s 자체 재시작(liveness)/트래픽 제외(readiness) 판단용.
          # actuator가 8081로 분리돼있어 포트는 8081, context-path(/api)는 안 붙음.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: qket-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    # ServiceMonitor.spec.selector.matchLabels가 보는 라벨 — 없으면 Prometheus가 relabel
    # 단계에서 drop해버림.
    app: qket-backend
spec:
  type: ClusterIP
  selector:
    app: qket-backend
  ports:
    - port: 80
      targetPort: 8080
