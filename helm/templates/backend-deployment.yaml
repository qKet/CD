apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: qket-backend
  template:
    metadata:
      labels:
        app: qket-backend
    spec:
      {{- if .Values.backend.serviceAccountName }}
      # S3 업로드용 IRSA — Terraform(module.storage)이 만든 서비스어카운트.
      # 이걸로 뜨면 S3Client가 고정 키 없이 자동으로 이 역할의 임시 자격증명을 씀.
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      {{- end }}
      containers:
        - name: qket-backend
          # CI가 이미지 push 후 values.yaml의 backend.image를 갱신 (git commit) → ArgoCD가 감지해서 재배포
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            {{- range .Values.backend.configMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.backend.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: qket-backend-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: qket-backend
  ports:
    - port: 80
      targetPort: 8080
