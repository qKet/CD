apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  {{- with .Values.backend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: qket-backend
  template:
    metadata:
      labels:
        app: qket-backend
    spec:
      {{- if .Values.backend.serviceAccountName }}
      # S3 업로드용 IRSA — Terraform(module.storage_release)이 만든 서비스어카운트.
      # 이걸로 뜨면 S3Client가 고정 키 없이 자동으로 이 역할의 임시 자격증명을 씀.
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      {{- end }}
      containers:
        - name: qket-backend
          # GitHub Actions에서 sed로 실제 이미지 태그로 치환
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          envFrom:
            {{- range .Values.backend.configMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.backend.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: qket-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    app: qket-backend
spec:
  type: ClusterIP
  selector:
    app: qket-backend
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.backend.port }}
