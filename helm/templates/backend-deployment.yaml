apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: qket-backend
  template:
    metadata:
      labels:
        app: qket-backend
    spec:
      {{- if .Values.backend.serviceAccountName }}
      # S3 업로드용 IRSA — Terraform(module.storage)이 만든 서비스어카운트.
      # 이걸로 뜨면 S3Client가 고정 키 없이 자동으로 이 역할의 임시 자격증명을 씀.
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      {{- end }}
      containers:
        - name: qket-backend
          # CI가 이미지 push 후 values.yaml의 backend.image를 갱신 (git commit) → ArgoCD가 감지해서 재배포
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 8081 # actuator 헬스체크 전용(management.server.port) — ALB가 여기로 헬스체크
          envFrom:
            {{- range .Values.backend.configMaps }}   # configMap 선언 
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.backend.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            # 소셜 로그인 완료 후 리다이렉트할 프론트엔드 origin (OAuthController가 씀).
            # ingress.host를 재사용 — 환경별로 값을 따로 안 적어도 dev/prod가 각자 맞는 값을 가짐.
            - name: APP_BASE_URL
              value: "https://{{ .Values.ingress.host }}"
            # replicas × 이 값의 합이 RDS max_connections(db.t3.micro 기준 ~85)를 넘지 않게 관리 —
            # 2026-08-13 부하테스트에서 8replica×40=320으로 잡았다가 커넥션 생성 자체가 병목났던 사고 참고.
            - name: TZ
              value: "Asia/Seoul"
            - name: DB_POOL_SIZE
              value: "{{ .Values.backend.dbPoolSize }}"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # ALB 헬스체크(Ingress healthcheck-port/path)와 별개 계층 — 이건 파드 자체가 멈췄을 때
          # k8s가 스스로 재시작(liveness)/트래픽 제외(readiness) 판단하는 용도. management.server.port로
          # actuator가 8081로 분리돼있어서 포트는 8081, 그리고 그 포트엔 server.servlet.context-path(/api)가
          #안 붙으므로 경로에 /api를 안 붙임(둘 다 CD PR 리뷰에서 8080/api 프리픽스로 잘못 올라왔던 걸 수정함).
          # /health/liveness, /health/readiness는 Spring Boot 헬스 그룹 —
          # management.endpoint.health.probes.enabled=true가 켜져 있어야 존재함(application.yml 참고).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: qket-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    # Service 자체의 라벨 — spec.selector(Pod를 찾는 용도)와는 별개.
    # ServiceMonitor.spec.selector.matchLabels가 보는 게 바로 이 라벨이라, 이게 없으면
    # Prometheus가 이 Service를 계속 discover는 하지만 relabel 단계에서 drop해버림
    # (2026-08-12 실제로 겪음 — qket-backend ServiceMonitor가 targets에 안 잡히던 원인).
    app: qket-backend
spec:
  type: ClusterIP
  selector:
    app: qket-backend
  ports:
    - port: 80
      targetPort: 8080
