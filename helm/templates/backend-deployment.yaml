apiVersion: apps/v1
kind: Deployment
metadata:
  name: qket-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: qket-backend
  template:
    metadata:
      labels:
        app: qket-backend
    spec:
      {{- if .Values.backend.serviceAccountName }}
      # S3 업로드용 IRSA — Terraform(module.storage)이 만든 서비스어카운트.
      # 이걸로 뜨면 S3Client가 고정 키 없이 자동으로 이 역할의 임시 자격증명을 씀.
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      {{- end }}
      containers:
        - name: qket-backend
          # CI가 이미지 push 후 values.yaml의 backend.image를 갱신 (git commit) → ArgoCD가 감지해서 재배포
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            {{- range .Values.backend.configMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.backend.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            # 소셜 로그인 완료 후 리다이렉트할 프론트엔드 origin (OAuthController가 씀).
            # ingress.host를 재사용 — 환경별로 값을 따로 안 적어도 dev/prod가 각자 맞는 값을 가짐.
            - name: APP_BASE_URL
              value: "https://{{ .Values.ingress.host }}"
            # JVM 기본 시간대가 컨테이너 기본값(UTC)으로 잡혀서, 예매 오픈 알림 스케줄러 등
            # 시간 비교 로직이 실제 한국시간이랑 9시간 어긋나던 문제(2026-08-18 발견) — 명시적으로 고정
            - name: TZ
              value: "Asia/Seoul"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # 이슈 #28 대응 — ALB 헬스체크와 별개로, Pod 자체가 멈췄을 때 k8s가 스스로 재시작/트래픽 제외를
          # 판단할 수 있게 함. path는 actuator의 liveness/readiness 그룹(DB·Redis 안 건드림)을 그대로 씀.
          # 2026-08-19: management.server.port로 actuator를 8081로 분리하면서 포트/경로 수정 —
          # 분리된 포트엔 server.servlet.context-path(/api)가 안 붙으므로 /api 프리픽스도 뺌.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: qket-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    # Service 자체의 라벨 — spec.selector(Pod를 찾는 용도)와는 별개.
    # ServiceMonitor.spec.selector.matchLabels가 보는 게 바로 이 라벨이라, 이게 없으면
    # Prometheus가 이 Service를 계속 discover는 하지만 relabel 단계에서 drop해버림
    # (2026-08-12 실제로 겪음 — qket-backend ServiceMonitor가 targets에 안 잡히던 원인).
    app: qket-backend
spec:
  type: ClusterIP
  selector:
    app: qket-backend
  ports:
    - port: 80
      targetPort: 8080
