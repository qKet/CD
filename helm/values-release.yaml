# CI가 이미지 push 후 이 파일의 backend.image / frontend.image 값을 갱신 (git commit)
# → ArgoCD가 감지해서 재배포. (예전엔 Deployment yaml의 image: 줄을 직접 고쳤지만,
#   chart로 바뀐 뒤로는 여기 값만 고치면 됨)

namespace: qket-release

backend:
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:backend-a282bf7
  # KEDA가 minReplicas~maxReplicas 사이에서 replicas를 실시간 조절 — 이 값은 최초 배포 시
  # 초기값일 뿐(ArgoCD ignoreDifferences). minReplicas(1)와 맞춤 — release는 최소한만 띄움.
  replicas: 1
  # dbPoolSize는 maxReplicas × dbPoolSize가 DB의 max_connections를 넘지 않게 잡아야 함.
  dbPoolSize: 12
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

    targetCPUUtilization: 70

  serviceAccountName: qket-backend
  configMaps:
    - app-config
    - storage-config
    #- notification-config
  secrets:
    - db-secrets
    # - redis-secrets
    - external-api-secrets #Secret Manager 값 가져오기
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "3"
      memory: "1Gi"

frontend:
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:frontend-865b1af
  replicas: 1 # backend와 같은 이유 — release는 최소한만 띄움
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

    targetCPUUtilization: 70
  serviceAccountName: qket-frontend

  revisionHistoryLimit: 2
  resources:
    # frontend는 SSR 자체는 단일 스레드지만 GC/libuv/V8 보조 스레드가 같은 cgroup CPU 쿼터를
    # 같이 써서 순간적으로 CFS 쿼터를 넘겨 스로틀링됨 — CPU limit을 없애 request 기반
    # fair-share로 스케줄링(노드 여유가 있는 한 스로틀링 자체가 안 걸림). memory는 OOM 격리용 limit 유지.
    requests:
      cpu: "0.5"
      memory: "128Mi"
    limits:
      memory: "256Mi"

# 실제 Gateway/HTTPRoute는 Infra(02_k8s-addon)가 만듦 — host만 여기 남겨둔 이유는
# backend-deployment.yaml의 APP_BASE_URL(소셜 로그인 리다이렉트)이 참조하기 때문.
ingress:
  host: dev.jun979.click # dev 쪽 Route53 추가 필요

networkPolicy:
  allowedNamespaces:
    - qket-release # 동일 namespace 안에서만 트래픽 허용
  # ALB(targetType: ip)가 Service 안 거치고 파드로 직접 붙는 경로 — namespaceSelector로는 안
  # 걸리는 트래픽이라 별도로 ipBlock 허용 필요. team5-qket-gw-*-alb가 이 두 public 서브넷에 있음.
  allowedCidrs:
    - 10.70.1.0/24 # public-ap-northeast-2a
    - 10.70.4.0/24 # public-ap-northeast-2b
  ports:
    - 8080 # 일반 API 요청
    - 8081 # actuator 헬스체크 전용 포트(management.server.port) — ALB가 여기로 헬스체크를
    #        보내는데, 이 포트를 안 열어두면 NetworkPolicy가 막아서 전부 unhealthy 처리됨
