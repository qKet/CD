# CI가 이미지 push 후 이 파일의 backend.image / frontend.image 값을 갱신 (git commit)
# → ArgoCD가 감지해서 재배포. (예전엔 Deployment yaml의 image: 줄을 직접 고쳤지만,
#   chart로 바뀐 뒤로는 여기 값만 고치면 됨)

namespace: qket-release

backend:
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:backend-017ef35
  # KEDA(backend-scaledobject.yaml)가 autoscaling.minReplicas~maxReplicas 사이에서 replicas를
  # 실시간으로 조절함 — 이 값은 그냥 "최초 배포 시 초기값"일 뿐, ArgoCD가 그 이후로 이 필드를
  # 계속 강제하진 않음(02_k8s-addon/argocd-apps.tf의 ignoreDifferences 참고). minReplicas(1)와
  # 맞춤 — release는 개발 서버라 평소엔 최소한만 띄우자는 방침(2026-08-21).
  replicas: 1
  # dbPoolSize는 maxReplicas × dbPoolSize가 DB의 max_connections를 넘지 않게 잡아야 함.
  # 2026-08-13 부하테스트(8×40=320으로 잡았다가 "커넥션 생성" 자체가 병목났던 사고) 이후로
  # 이 계산을 항상 먼저 하기로 함. 2026-08-20: RDS가 db.t3.micro→db.t3.medium으로 올라간 뒤
  # 이 계산을 안 다시 해서, maxReplicas(12)×dbPoolSize(10)=120이 db.t3.medium의 실제
  # max_connections(341, RDS 파라미터그룹 기본 공식값)보다 훨씬 작은 값에 계속 묶여있었음
  # — 2000명 e2e 부하테스트에서 RDS DatabaseConnections가 정확히 120에서 5분 넘게 고정,
  # HikariCP "Connection is not available" 타임아웃이 10분간 68건 발생하는 걸로 실제 확인.
  # 그때 maxReplicas 20 × dbPoolSize 12 = 240 (341의 약 70%)로 상향했었음.
  #
  # 2026-08-21: release가 RDS 대신 dev-datastore(StatefulSet MySQL, mysql:8.0 이미지를 별도
  # 설정 없이 그대로 씀)로 옮겨가면서 위 240이라는 숫자의 근거(db.t3.medium의 341)가 사라짐 —
  # dev-mysql pod에 직접 접속해 확인한 실제 max_connections는 151(MySQL 기본값)뿐이라 240은
  # 이미 초과 상태였음(그동안 실제로 20까지 스케일업한 적이 없어서 안 드러났을 뿐 —
  # Max_used_connections 실측 62).
  #
  # 같은 날 후속 — "release는 어차피 개발 서버니까 최대한 가볍게, 꼭 필요한 만큼만 띄우자"는
  # 방침에 따라 151 여유 안에서 안전하게 맞추는 수준(maxReplicas 8)보다 더 낮춰서 minReplicas 1
  # / maxReplicas 2로 재조정 — 평소엔 파드 1개만 떠있다가 팀원이 직접 부하테스트할 때만 잠깐
  # 2개까지 늘어나는 정도. 12×2=24로 151 대비 여유가 훨씬 큼(대신 이 낮은 replica 수 자체가
  # release의 실질 처리량 상한이 됨 — 진짜 부하테스트가 필요하면 이 값을 일시적으로 올려야 함).
  dbPoolSize: 12
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70

  serviceAccountName: qket-backend
  configMaps:
    - app-config
    - storage-config
    #- notification-config
  secrets:
    - db-secrets
    # - redis-secrets
    - external-api-secrets #Secret Manager 값 가져오기
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "3"
      memory: "1Gi"

frontend:
  image: 727646470302.dkr.ecr.ap-northeast-2.amazonaws.com/team5/ecr/qket:frontend-875e1a8
  # backend와 같은 이유(2026-08-21) — release는 개발 서버라 평소엔 최소한만 띄움.
  replicas: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70
  serviceAccountName: qket-frontend

  revisionHistoryLimit: 2
  resources:
    # frontend(Next.js SSR)는 메인 렌더링은 단일 스레드지만 GC/libuv 스레드풀/V8 백그라운드
    # 컴파일러 같은 보조 스레드가 같은 cgroup CPU 쿼터를 같이 씀 — 1분 평균 사용량은 낮아도
    # 이것들이 순간적으로 겹치면 100ms 단위 CFS 쿼터를 넘겨서 스로틀링됨(2026-08-18 실측:
    # limit을 0.5→1코어로 올린 뒤에도 유휴 수준 부하에서 5분당 1~3회씩 계속 스로틀링 걸림 —
    # 그라파나 "CPU 스로틀링" 패널 참고). CPU limit을 아예 없애서 하드 쿼터(CFS) 대신
    # request 기반 fair-share(cgroup cpu.shares)로 스케줄링되게 함 — 이러면 노드에 여유가
    # 있는 한 스로틀링 자체가 구조적으로 안 걸림. request는 스케줄링 보장값이자 KEDA
    # Utilization 계산 기준이라 그대로 둠. memory는 계속 limit으로 OOM 시 격리.
    requests:
      cpu: "0.5"
      memory: "128Mi"
    limits:
      memory: "256Mi"

# 2026-08-10: 실제 Ingress 오브젝트는 이제 여기(Helm/ArgoCD)가 아니라 Infra(02_k8s-addon,
# kubernetes_ingress_v1.app_ingress)가 만듦 — destroy 시 "Ingress가 alb_controller보다 먼저
# 없어져야 한다"는 순서를 depends_on으로 강제하려고 같은 Terraform state로 옮김. host만
# 여기 남겨둔 이유는 backend-deployment.yaml의 APP_BASE_URL(소셜 로그인 리다이렉트)이 참조하기
# 때문 — Infra 쪽 locals.ingress_config와 같은 값을 나타내지만 용도가 달라서 하나로 합치진 않음.
ingress:
  host: dev.jun979.click # dev 쪽 Route53 추가 필요

networkPolicy:
  allowedNamespaces:
    - qket-release # 동일 namespace 안에서만 트래픽 허용
  ports:
    - 8080 # 일반 API 요청
    - 8081 # actuator 헬스체크 전용 포트(management.server.port) — ALB가 여기로 헬스체크를
    #        보내는데, 이 포트를 안 열어두면 NetworkPolicy가 막아서 전부 unhealthy 처리됨
